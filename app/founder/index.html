<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090d"><title>Founder metrics — DriverTakings</title><link rel="stylesheet" href="/assets/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app"><main class="content" style="margin:0 auto;max-width:900px;padding:32px 20px"><div class="topline"><div><div class="eyebrow">DriverTakings</div></div><a href="/app/" class="muted">← Back to app</a></div>
<header><h1>Founder metrics</h1><p class="lead">Not linked from the main nav — bookmark this page. Only your account can load it.</p></header>
<div id="body"><p class="muted">Loading…</p></div>
<div class="bottom-space"></div></main></div><script src="/assets/app.js"></script><script>(async()=>{try{await DTApp.load();const {data:{session}}=await sb.auth.getSession();const r=await fetch('/.netlify/functions/founder-metrics',{headers:{Authorization:'Bearer '+session.access_token}});const data=await r.json();if(!r.ok){$('body').innerHTML='<div class="card"><p class=muted>'+(data.error||'Could not load metrics.')+'</p></div>';return}$('body').innerHTML='<section class="grid3"><div class="card"><span class="muted">Total users</span><div class="big-answer">'+data.totalUsers+'</div></div><div class="card"><span class="muted">New signups — 7 days</span><div class="big-answer">'+data.signupsWeek+'</div></div><div class="card"><span class="muted">New signups — this month</span><div class="big-answer">'+data.signupsMonth+'</div></div></section><section class="card" style="margin-top:16px"><div class="eyebrow">Tier mix</div><h2>Where users sit</h2><div class="driver-cat"><b>Free</b><span>'+(data.tierCounts.free||0)+'</span></div><div class="driver-cat"><b>Business</b><span>'+(data.tierCounts.business||0)+'</span></div><div class="driver-cat"><b>MTD</b><span>'+(data.tierCounts.mtd||0)+'</span></div></section><p class="muted" style="margin-top:14px">As of '+new Date(data.generatedAt).toLocaleString('en-GB')+'</p>'}catch(e){console.error(e);$('body').innerHTML='<div class="card"><p class=muted>'+e.message+'</p></div>'}})();</script></body></html>
